name: Rust tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # 网络抖动重试（海外 runner 拉 crates.io 偶发失败）。
  CARGO_NET_RETRY: "5"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  rust-tests:
    name: Rust tests
    strategy:
      fail-fast: true
      matrix:
        # Only run tests on Linux for now to save CI minutes since all tests are cross-platform currently
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt install libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld

      # 移除项目 .cargo/config.toml（指向 rsproxy.cn 国内镜像，海外 runner 拉取
      # 不稳定）。CI checkout 是一次性的，删除不影响仓库；cargo 改用默认 crates.io。
      - name: Use default crates.io registry (drop project mirror config)
        shell: bash
        run: rm -f .cargo/config.toml

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          toolchain: stable
          cache: true

      - name: Run tests
        run: cargo test --all --all-features
        working-directory: src-tauri
