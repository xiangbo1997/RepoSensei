name: Rust linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 网络抖动重试（海外 runner 拉 crates.io 偶发失败）。
  CARGO_NET_RETRY: "5"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  rust-linting:
    name: Rust cross-platform linting
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt install libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld

      # 移除项目 .cargo/config.toml（指向 rsproxy.cn 国内镜像，海外 runner 拉取
      # 不稳定）。CI checkout 是一次性的，删除不影响仓库；cargo 改用默认 crates.io。
      - name: Use default crates.io registry (drop project mirror config)
        shell: bash
        run: rm -f .cargo/config.toml

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          toolchain: stable
          cache: true

      # tauri-build 的 build.rs 会校验 tauri.conf.json 里声明的 bundle.resources
      # 目录（resources/）存在。该目录是 release 构建产物（见 scripts/prepare-sidecar.mjs），
      # 已 gitignore 不入库。CI 只跑 cargo clippy，无需真实资源内容——建空占位目录
      # 即可满足存在性校验，省下下载 120MB Node + 装 repomix 的时间。
      - name: Create placeholder bundle resources dir
        shell: bash
        run: mkdir -p src-tauri/resources/sidecar

      - name: Run lint
        run: cargo clippy --all-targets --all-features
        working-directory: src-tauri

      - name: Run format check
        run: cargo fmt --all -- --check
        working-directory: src-tauri
